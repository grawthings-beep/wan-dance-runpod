name: Build GHCR image

on:
  push:
    branches: [main, codex/scail2-quality]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python scripts/build_quality_workflows.py --check
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/start.sh

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        shell: bash
        run: |
          echo "immutable=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "channel=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=ghcr.io/${{ github.repository }}:scail2-quality-preview" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.immutable }}
            ${{ steps.tags.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validation scope
        run: echo "CPU imports, graph schemas, references, core 3D tiled decode and recovery latent verified. GPU video generation NOT RUN." >> "$GITHUB_STEP_SUMMARY"
